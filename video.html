<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Studio - AI Work Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎬 VIDEO STUDIO</h1>
        <p>Create your complete video package with AI</p>
    </div>

    <div class="tool-card">

        <h2>What do you want to create?</h2>

        <br>

        <label>Video Type</label>

        <select id="videoType">
            <option>Product Advertisement</option>
            <option>YouTube Video</option>
            <option>Instagram Reel</option>
            <option>Cinematic Video</option>
            <option>Short Video</option>
        </select>

        <br><br>

        <label>Describe your idea</label>

        <textarea
            id="idea"
            placeholder="Example: Create a cinematic advertisement for a premium perfume..."
        ></textarea>

        <br><br>

        <label>Duration</label>

        <div>
            <button onclick="setDuration(15)">15 sec</button>
            <button onclick="setDuration(30)">30 sec</button>
            <button onclick="setDuration(60)">60 sec</button>
        </div>

        <br>

        <label>Style</label>

        <select id="style">
            <option>Cinematic</option>
            <option>Luxury</option>
            <option>Modern</option>
            <option>Corporate</option>
            <option>Documentary</option>
        </select>

        <br><br>

        <button onclick="createVideoPackage()">
            🚀 CREATE VIDEO PACKAGE
        </button>

    </div>

    <div id="result" class="tool-card" style="display:none; margin-top:25px;">

        <h2>Your Video Package</h2>

        <br>

        <h3>📝 Script</h3>
        <p id="scriptResult"></p>

        <br>

        <h3>🎬 Scene Prompts</h3>
        <p id="sceneResult"></p>

        <br>

        <h3>🎙️ Voiceover</h3>
        <p id="voiceResult"></p>

        <br>

        <h3>📄 Subtitles</h3>
        <p id="subtitleResult"></p>

        <br>

        <h3>🖼️ Thumbnail</h3>
        <p id="thumbnailResult"></p>

        <br>

        <h3>📱 Social Media</h3>
        <p id="socialResult"></p>

    </div>

</div>

<script>

let selectedDuration = 30;

function setDuration(duration) {
    selectedDuration = duration;
}

function createVideoPackage() {

    const idea = document.getElementById("idea").value;
    const type = document.getElementById("videoType").value;
    const style = document.getElementById("style").value;

    if (idea.trim() === "") {
        alert("Please enter your video idea.");
        return;
    }

    document.getElementById("result").style.display = "block";

    document.getElementById("scriptResult").innerText =
        "Video Type: " + type +
        " | Duration: " + selectedDuration +
        " seconds | Style: " + style +
        " | Idea: " + idea;

    document.getElementById("sceneResult").innerText =
        "AI will generate cinematic scene-by-scene prompts based on your idea.";

    document.getElementById("voiceResult").innerText =
        "AI will create a professional voiceover script matching the selected duration.";

    document.getElementById("subtitleResult").innerText =
        "AI will generate perfectly timed subtitles in SRT format.";

    document.getElementById("thumbnailResult").innerText =
        "AI will create a professional thumbnail concept and image prompt.";

    document.getElementById("socialResult").innerText =
        "AI will generate a title, description and hashtags for social media.";
}

</script>

</body>
</html>
